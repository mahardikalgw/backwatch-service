name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-netbird
        with:
          setup_key: ${{ secrets.NETBIRD_SETUP_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-agent.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-agent.txt
          pip install "pytest>=8" "pytest-asyncio>=0.23" "ruff>=0.4" "mypy>=1.9"

      - name: Lint (ruff check)
        run: ruff check app agent scripts tests

      - name: Format check (ruff format)
        run: ruff format --check app agent scripts tests

      - name: Type check (mypy)
        run: mypy app agent scripts

      - name: Tests
        run: pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-netbird
        with:
          setup_key: ${{ secrets.NETBIRD_SETUP_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-agent.txt

      - name: Bandit security scan
        run: |
          pip install 'bandit[sarif]'
          bandit -r app agent scripts -f sarif -o bandit-results.sarif || true
          ls -lh bandit-results.sarif || true

      - name: Ensure Bandit SARIF exists
        if: always()
        run: |
          if [ ! -f bandit-results.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[]}' > bandit-results.sarif
            echo "Created fallback bandit-results.sarif"
          fi
          ls -lh bandit-results.sarif
          cat bandit-results.sarif | head -c 500; echo

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          severity: HIGH,CRITICAL

      - name: Ensure Trivy SARIF exists
        if: always()
        run: |
          if [ ! -f trivy-results.sarif ]; then
            echo '{"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json","runs":[]}' > trivy-results.sarif
          fi
          ls -lh trivy-results.sarif || true

      - name: Upload Bandit results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: bandit-results.sarif

      - name: Upload Trivy results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-netbird
        with:
          setup_key: ${{ secrets.NETBIRD_SETUP_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4