name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  security-events: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-netbird
        with:
          setup_key: ${{ secrets.NETBIRD_SETUP_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-agent.txt
          pip install "pytest>=8" "pytest-asyncio>=0.23" "ruff>=0.4" "mypy>=1.9"

      - name: Lint (ruff check)
        run: ruff check app agent scripts tests

      - name: Type check (mypy)
        run: mypy app agent scripts

      - name: Tests
        run: pytest -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-netbird
        with:
          setup_key: ${{ secrets.NETBIRD_SETUP_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-agent.txt

      - name: Bandit security scan
        run: |
          pip install bandit
          bandit -r app agent scripts -f sarif -o bandit-results.sarif || true

      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          exit-code: 0
          severity: HIGH,CRITICAL

      - name: Upload Bandit results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: bandit-results.sarif

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  codeql:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-netbird
        with:
          setup_key: ${{ secrets.NETBIRD_SETUP_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3

  agent-artifact:
    needs: [test, security, codeql]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-netbird
        with:
          setup_key: ${{ secrets.NETBIRD_SETUP_KEY }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set agent package version from input
        run: sed -i "s/^version = .*/version = \"${VERSION#v}\"/" agent/pyproject.toml
        env:
          VERSION: ${{ inputs.version }}

      - name: Build agent wheel
        run: |
          pip install build
          python -m build --wheel agent --outdir dist

      - name: Package agent deploy templates
        run: tar -czf backwatch-agent-deploy.tar.gz -C deploy/agent .

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: ${{ inputs.version }}
          generate_release_notes: true
          files: |
            dist/*.whl
            backwatch-agent-deploy.tar.gz

  api-image:
    needs: [test, security, codeql]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-netbird
        with:
          setup_key: ${{ secrets.NETBIRD_SETUP_KEY }}

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mahardikalgw/backwatch-service:${{ inputs.version }}
            ghcr.io/mahardikalgw/backwatch-service:latest

      - name: Trivy container image scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          scan-ref: ghcr.io/mahardikalgw/backwatch-service:${{ inputs.version }}
          format: sarif
          output: trivy-image-results.sarif
          exit-code: 0
          severity: HIGH,CRITICAL

      - name: Upload container scan results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image-results.sarif

  deploy-api:
    needs: [api-image, agent-artifact]
    runs-on: ubuntu-latest
    steps:
      - uses: ./.github/actions/setup-netbird
        with:
          setup_key: ${{ secrets.NETBIRD_SETUP_KEY }}

      - name: Deploy backup-api to server via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u "${{ secrets.GHCR_USER }}" --password-stdin
            cd /opt/backwatch-api
            export BACKWATCH_IMAGE="ghcr.io/mahardikalgw/backwatch-service:${{ inputs.version }}"
            docker compose pull backup-api
            docker compose up -d --no-build backup-api
            docker image prune -f