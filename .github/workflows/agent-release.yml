name: Agent Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-agent.txt
          pip install "pytest>=8" "pytest-asyncio>=0.23" "ruff>=0.4" "mypy>=1.9"

      - name: Lint (ruff check)
        run: ruff check app agent scripts tests

      - name: Type check (mypy)
        run: mypy app agent scripts

      - name: Tests
        run: pytest -q

  agent-artifact:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Determine version
        id: version
        run: |
          VERSION="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Set agent package version
        run: sed -i "s/^version = .*/version = \"${VERSION#v}\"/" agent/pyproject.toml
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: Build agent wheel
        run: |
          pip install build
          python -m build --wheel agent --outdir dist

      - name: Package agent deploy templates
        run: tar -czf backwatch-agent-deploy.tar.gz -C deploy/agent .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.whl
            backwatch-agent-deploy.tar.gz