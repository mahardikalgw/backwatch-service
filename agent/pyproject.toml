[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "backwatch-agent"
version = "0.1.0"
description = "backwatch backup agent - centralized database backups"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "pydantic-settings>=2.2",
    "boto3>=1.34",
    "eval_type_backport>=0.2.0",
]

[tool.setuptools]
packages = ["agent"]

[tool.setuptools.package-dir]
"" = ".."