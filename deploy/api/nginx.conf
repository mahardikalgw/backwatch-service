# Nginx reverse proxy in front of the backup-api (uvicorn on 127.0.0.1:8000).
# Adjust server_name and the TLS certificate paths; then:
#   ln -s /etc/nginx/sites-available/backwatch /etc/nginx/sites-enabled/backwatch
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name backup.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name backup.example.com;

    ssl_certificate     /etc/letsencrypt/live/backup.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/backup.example.com/privkey.pem;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}